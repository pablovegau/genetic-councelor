name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lo lanza update-vrt.yml tras subir capturas nuevas (sus commits no disparan la CI solos).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Misma imagen que scripts/e2e-docker.sh: las capturas de VRT dependen del sistema.
    # Mantener la versión igual que la de @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Tokens, tests unitarios y de componentes (Chromium) y umbral de cobertura.
      - run: pnpm coverage
      # La compilación de producción no incluye el catálogo del design system.
      - name: Production build leaves the catalog out
        run: |
          pnpm build
          test -f dist/index.html
          test ! -d dist/design-system
      # Las pruebas sí lo necesitan: se compila con el catálogo.
      - run: pnpm build
        env:
          KEEP_CATALOG: "true"
      # Accesibilidad, humo y regresión visual contra el sitio compilado.
      # Firefox no arranca si $HOME no es del usuario actual (en el contenedor es /github/home).
      - run: pnpm exec playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
