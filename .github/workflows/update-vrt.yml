name: Update VRT baselines

# Regenera las capturas de regresión visual en la imagen de Playwright y las sube a la rama.
# Ejecutar a mano (Actions → Update VRT baselines) cuando un cambio visual sea intencionado.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright test vrt --update-snapshots
      - name: Commit the new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e
          if git diff --cached --quiet; then
            echo "Sin cambios en las capturas."
          else
            git commit -m "Update VRT baselines"
            git push
          fi
